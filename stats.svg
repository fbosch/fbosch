    <text x="420" y="320" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">CSS</text>
    <text x="760" y="320" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">1.8%</text>
    <rect x="420" y="324" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="324" width="6.120000000000001" height="16" rx="4" fill="#563d7c"/>

    <!-- Rust -->
    <text x="420" y="360" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Rust</text>
    <text x="760" y="360" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">1.1%</text>
    <rect x="420" y="364" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="364" width="3.74" height="16" rx="4" fill="#dea584"/>
</svg>