<svg width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header { font-weight: 600; font-size: 16px; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="420" fill="#0d1117" rx="6"/>
  <rect width="800" height="420" fill="none" stroke="#30363d" stroke-width="1" rx="6"/>
  
  <!-- Headers -->
  <text x="40" y="40" fill="#e6edf3" class="header" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">GitHub Stats</text>
  <text x="420" y="40" fill="#e6edf3" class="header" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Top Languages</text>
  
  <!-- Divider -->
  <line x1="400" y1="20" x2="400" y2="400" stroke="#30363d" stroke-width="1"/>
  
  <!-- Stats -->
  
    <text x="40" y="80" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">⭐</text>
    <text x="70" y="80" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Total Stars</text>
    <text x="360" y="80" fill="#e6edf3" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">60</text>

    <text x="40" y="120" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🔀</text>
    <text x="70" y="120" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Pull Requests</text>
    <text x="360" y="120" fill="#e6edf3" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">94</text>

    <text x="40" y="160" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">📋</text>
    <text x="70" y="160" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Issues</text>
    <text x="360" y="160" fill="#e6edf3" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">37</text>

    <text x="40" y="200" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🤝</text>
    <text x="70" y="200" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Contributed Repos</text>
    <text x="360" y="200" fill="#e6edf3" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">29</text>

    <text x="40" y="240" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🔥</text>
    <text x="70" y="240" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Current Streak</text>
