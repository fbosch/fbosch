    <text x="420" y="160" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Shell</text>
    <text x="760" y="160" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">7.8%</text>
    <rect x="420" y="164" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="164" width="26.52" height="16" rx="4" fill="#89e051"/>

