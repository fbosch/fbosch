    <text x="420" y="200" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">C</text>
    <text x="760" y="200" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">4.5%</text>
    <rect x="420" y="204" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="204" width="15.299999999999999" height="16" rx="4" fill="#555555"/>

    <!-- Lua -->
    <text x="420" y="240" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Lua</text>
    <text x="760" y="240" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">4.5%</text>
    <rect x="420" y="244" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="244" width="15.299999999999999" height="16" rx="4" fill="#000080"/>

    <!-- Nix -->
    <text x="420" y="280" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Nix</text>
    <text x="760" y="280" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">3.7%</text>
    <rect x="420" y="284" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="284" width="12.580000000000002" height="16" rx="4" fill="#7e7eff"/>

