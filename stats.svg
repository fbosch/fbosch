    <text x="760" y="120" fill="#7d8590" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">9.9%</text>
    <rect x="420" y="124" width="340" height="16" rx="4" fill="#21262d"/>
    <rect x="420" y="124" width="33.660000000000004" height="16" rx="4" fill="#f1e05a"/>

