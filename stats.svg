    <text x="40" y="280" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🏆</text>
    <text x="70" y="280" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Longest Streak</text>
    <text x="360" y="280" fill="#e6edf3" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">41 days</text>

    <text x="40" y="320" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">📅</text>
    <text x="70" y="320" fill="#7d8590" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Active Days (2026)</text>
    <text x="360" y="320" fill="#e6edf3" font-size="14" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="end">6 days</text>
  
  <!-- Language Bars -->
  
    <!-- TypeScript -->
    <text x="420" y="80" fill="#e6edf3" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">TypeScript</text>
